<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>StudyTrack</h1>
        <p>Your personal productivity dashboard</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h2>📚 Study Hours</h2>
                <p id="study-hours">0 hrs</p>
            </div>

            <div class="card">
                <h2>✅ Tasks</h2>
                <p id="task-count">0</p>
            </div>

            <div class="card">
                <h2>💰 Expenses</h2>
                <p id="expenses">₹0</p>
            </div>

            <div class="card">
                <h2>🎯 Goal</h2>
                <p id="goal">0%</p>
            </div>

        </section>

        <section class="study-tracker">

            <h2>📚 Track Study Time</h2>

            <div class="study-input">
                <input
                    type="number"
                    id="study-time"
                    placeholder="Enter hours studied..."
                    min="0"
                    step="0.5"
                >

                <button id="add-study-time">Add Study Time</button>
            </div>

        </section>
<section class="expense-tracker">

    <h2>💰 Track Expenses</h2>

    <div class="expense-input">

        <input
            type="number"
            id="expense-amount"
            placeholder="Enter expense amount..."
            min="0"
        >

        <button id="add-expense">Add Expense</button>

    </div>

</section>
<section class="goal-tracker">

    <h2>🎯 Track Goal Progress</h2>

    <div class="goal-input">

        <input
            type="number"
            id="goal-progress"
            placeholder="Enter progress percentage..."
            min="0"
            max="100"
        >

        <button id="update-goal">Update Goal</button>

    </div>

</section>
        <section class="tasks">

    <h2>Today's Tasks</h2>

    <div class="task-input">
        <input
            type="text"
            id="new-task"
            placeholder="Enter a new task..."
        >

        <button id="add-task">Add Task</button>
    </div>

    <ul id="task-list">
        <li>Complete Mathematics assignment</li>
        <li>Practice Java</li>
        <li>Revise Physics</li>
    </ul>

</section>

    </main>

    <footer>
        <p>StudyTrack © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
